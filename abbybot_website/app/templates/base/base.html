<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        
        {% block meta %}
        <!-- Default Meta Tags -->
        <meta name="description" content="AbbyBot is a multifunctional app designed to enhance your experience on Discord servers with features such as commands, status, privileges, and more.">
        <meta name="keywords" content="AbbyBot, Discord, Bot, Commands, Privileges, Dashboard, Status, News, Socials">
        <meta name="author" content="ReyesAndFriends.cl Team">
    
        <!-- Open Graph Meta Tags -->
        <meta property="og:title" content="AbbyBot - Multifunctional Discord Bot">
        <meta property="og:description" content="Enhance your Discord experience with AbbyBot's commands, privileges, and more!">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://reyesandfriends.cl">
        <meta property="og:image" content="{{ url_for('static', filename='img/icon/abbybot_logo.png') }}">
    
        <!-- Twitter Meta Tags -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="AbbyBot - Multifunctional Discord Bot">
        <meta name="twitter:description" content="Enhance your Discord experience with AbbyBot's commands, privileges, and more!">
        <meta name="twitter:image" content="{{ url_for('static', filename='img/icon/abbybot_logo.png') }}">
        <meta name="twitter:site" content="@AbbyBotProject">
        {% endblock %}
    
    <meta charset="UTF-8">
    
    <title>{% block title %}AbbyBot{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/icon/abbybot_logo.png') }}" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.css" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'base/components/navbar.html' %}

    {% block content %}
    {% endblock %}

    {% include 'base/components/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800, 
            once: true 
        });

        // Function to get current year
        function getCurrentYear() {
            const date = new Date();
            return date.getFullYear();
        }

        // Set the current year in the footer
        document.getElementById('currentYear').textContent = getCurrentYear();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
