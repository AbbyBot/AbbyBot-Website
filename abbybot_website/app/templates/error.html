{% extends "base/base.html" %}

{% block title %}Error - AbbyBot{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/error.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
{% endblock %}

{% block content %}
<section class="error-section">
    <div class="error-card" data-aos="fade-up" data-aos-delay="100">
        <h1 data-aos="zoom-in" data-aos-delay="200">
            <i class="fa-solid fa-exclamation-circle"></i> Oops!
        </h1>
        <img src="{{ url_for('static', filename='img/error_handler/404.gif') }}" alt="Error" class="error-gif" data-aos="zoom-in" data-aos-delay="300">
        <p data-aos="fade-up" data-aos-delay="300">{{ message }}</p>
    </div>
</section>
{% endblock %}
